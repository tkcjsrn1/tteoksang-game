# Render 블루프린트: 무료 웹 서비스 하나로 화면·API·WebSocket을 모두 제공합니다.
# 데이터베이스는 Render 무료 DB가 30일 뒤 만료되므로 Neon 무료 PostgreSQL을 따로 만들어 DATABASE_URL에 넣습니다.
# 절차: docs/DEPLOY-FREE.md
services:
  - type: web
    name: tteoksang-game
    runtime: docker
    plan: free
    region: singapore          # 한국에서 가장 가까운 Render 지역
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL       # Neon 연결 문자열. 대시보드에서 직접 넣습니다(저장소에 올리지 않음).
        sync: false
      - key: PUBLIC_URL         # 배포 주소(예: https://tteoksang-game.onrender.com). 카카오톡 링크 미리보기에 씁니다.
        sync: false
      - key: TRUST_PROXY        # Render는 리버스 프록시 뒤에서 돌기 때문에 필요합니다.
        value: "1"
      - key: NODE_ENV
        value: production
