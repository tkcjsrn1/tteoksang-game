# 배포한 서버에 가짜 참가자를 붙여 학술제 한 판을 끝까지 돌려 봅니다. 손으로만 실행합니다.
# GitHub → Actions → Rehearsal → Run workflow. 80명 3라운드면 무료 서버 월 전송량(5GB) 중 약 100MB를 씁니다.
# 사람이 플레이 중일 때나 발표 당일에는 돌리지 마세요.
name: Rehearsal
on:
  # 이 브랜치에 푸시하면 기본값(80명·3라운드)으로 한 번 돕니다. main에 머지하기 전 시험용
  push:
    branches: [chore/rehearsal-workflow]
  workflow_dispatch:
    inputs:
      url:
        description: 배포 주소
        default: https://tteoksang-game.onrender.com
        required: true
      players:
        description: 가짜 참가자 수(1~80)
        default: '80'
        required: true
      rounds:
        description: 라운드 수(3·5·8·10)
        default: '3'
        required: true

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # 무료 서버가 잠들어 있으면 깨우는 데 1분 가까이 걸립니다
      # 입력값은 환경 변수로만 넘깁니다(명령에 바로 끼워 넣지 않음)
      - name: 서버 깨우기와 버전 확인
        env: { URL: "${{ inputs.url || 'https://tteoksang-game.onrender.com' }}" }
        # 방금 main에 머지했다면 Render가 새 버전으로 바뀔 때까지 기다립니다(재시작 중에 돌면 결과가 틀어짐)
        run: |
          main=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -c1-7)
          echo "기다리는 버전: $main"
          for i in $(seq 1 60); do
            h=$(curl -sf --max-time 30 "$URL/api/health" || true)
            echo "$h" | grep -q "$main" && { echo "$h"; exit 0; }
            sleep 15
          done
          echo "15분 안에 새 버전이 뜨지 않았습니다: $h"; exit 1
      - name: 리허설
        env: { URL: "${{ inputs.url || 'https://tteoksang-game.onrender.com' }}", PLAYERS: "${{ inputs.players || '80' }}", ROUNDS: "${{ inputs.rounds || '3' }}" }
        run: npm run rehearsal -- "$URL" "$PLAYERS" "$ROUNDS"
